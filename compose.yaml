# Local Docker deployment for the CollectivIQ gateway scaffold.
#
# The container binds HOST=0.0.0.0 internally, but the port is published ONLY to
# host loopback (127.0.0.1). Credentials are supplied through environment
# interpolation (from your shell or a local .env); no functional secret is
# stored in this file.
#
# Upstream authentication is selected by COLLECTIVIQ_AUTH_MODE (default `bearer`).
# The gateway validates the mode-appropriate credential at startup with
# value-free errors, so the upstream credentials are forwarded softly (`:-`)
# rather than hard-required here — this lets `password` mode run WITHOUT
# COLLECTIVIQ_API_KEY set. Only COLLECTIVIQ_GATEWAY_KEYS (client auth) keeps the
# `:?` fail-fast guard.
#
#   bearer   mode requires COLLECTIVIQ_API_KEY.
#   password mode requires COLLECTIVIQ_USERNAME and COLLECTIVIQ_PASSWORD.

services:
  gateway:
    build: .
    image: collectiviq-gateway:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      ENVIRONMENT: "production"
      HOST: "0.0.0.0"
      PORT: "8787"
      COLLECTIVIQ_BASE_URL: "https://api.prod.collectiviq.ai"
      COLLECTIVIQ_AUTH_MODE: "${COLLECTIVIQ_AUTH_MODE:-bearer}"
      COLLECTIVIQ_API_KEY: "${COLLECTIVIQ_API_KEY:-}"
      COLLECTIVIQ_USERNAME: "${COLLECTIVIQ_USERNAME:-}"
      COLLECTIVIQ_PASSWORD: "${COLLECTIVIQ_PASSWORD:-}"
      COLLECTIVIQ_GATEWAY_KEYS: "${COLLECTIVIQ_GATEWAY_KEYS:?set COLLECTIVIQ_GATEWAY_KEYS in your shell or .env}"
      MODEL_CONFIG_PATH: "/app/config/models.yaml"
      LOG_LEVEL: "info"
      LOG_CONTENT: "false"
      # Process-local capacity/backpressure and shutdown drain (defaults shown).
      # Capacity is per-process, not shared across replicas.
      MAX_CONCURRENT_REQUESTS: "${MAX_CONCURRENT_REQUESTS:-4}"
      MAX_CONCURRENT_REQUESTS_PER_KEY: "${MAX_CONCURRENT_REQUESTS_PER_KEY:-2}"
      MAX_QUEUED_REQUESTS: "${MAX_QUEUED_REQUESTS:-20}"
      MAX_QUEUE_WAIT_MS: "${MAX_QUEUE_WAIT_MS:-5000}"
      SHUTDOWN_DRAIN_MS: "${SHUTDOWN_DRAIN_MS:-30000}"
      # OPTIONAL Redis-backed cross-replica idempotency (Phase 4A). Empty by
      # default, which disables Redis entirely: unkeyed requests behave exactly
      # as before and a supplied `Idempotency-Key` fails closed with 503. To
      # enable it locally, start the `redis` profile below and export both
      # REDIS_URL and IDEMPOTENCY_ENCRYPTION_KEY in your shell or .env.
      #
      # There is deliberately NO `depends_on: [redis]`: the gateway must start
      # and serve `/healthz` whether or not Redis is running.
      #
      # When BOTH services run in Compose, REDIS_URL must use the Redis service
      # hostname (`redis://redis:6379`); `127.0.0.1` inside this container is the
      # gateway itself. Use `redis://127.0.0.1:6379` only for a gateway running
      # natively against the published port.
      REDIS_URL: "${REDIS_URL:-}"
      IDEMPOTENCY_ENCRYPTION_KEY: "${IDEMPOTENCY_ENCRYPTION_KEY:-}"
      IDEMPOTENCY_TTL_MS: "${IDEMPOTENCY_TTL_MS:-600000}"
      REDIS_KEY_PREFIX: "${REDIS_KEY_PREFIX:-collectiviq-gateway}"
      # OPTIONAL Redis-backed cross-replica per-gateway-key rate limiting
      # (Phase 4B). Disabled by default, in which case no limiter or Redis
      # rate-limit operation runs at all. Enabling it REQUIRES REDIS_URL (and
      # therefore IDEMPOTENCY_ENCRYPTION_KEY) above; it shares that one Redis
      # connection with idempotency under a separate `:rate:` key category.
      RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-false}"
      RATE_LIMIT_REQUESTS: "${RATE_LIMIT_REQUESTS:-60}"
      RATE_LIMIT_WINDOW_MS: "${RATE_LIMIT_WINDOW_MS:-60000}"
      RATE_LIMIT_BURST: "${RATE_LIMIT_BURST:-8}"
      # OPTIONAL Redis-backed OpenCode thread reuse (Phase 5A, pulled forward).
      # Disabled by default, in which case every completion creates its own
      # CollectivIQ thread and no reuse Redis operation runs at all. Enabling it
      # REQUIRES REDIS_URL (and therefore IDEMPOTENCY_ENCRYPTION_KEY) above; it
      # shares that one Redis connection under a separate `:reuse:` key
      # category. Only direct-prompt, tool-free models with a valid
      # X-CollectivIQ-OpenCode-Session-ID header are eligible; it is fail-closed
      # and is NOT production ready (see .env.example).
      OPENCODE_THREAD_REUSE_ENABLED: "${OPENCODE_THREAD_REUSE_ENABLED:-false}"
      OPENCODE_THREAD_REUSE_TTL_MS: "${OPENCODE_THREAD_REUSE_TTL_MS:-604800000}"
    volumes:
      # Provide your own model file (copied from config/models.example.yaml).
      - "./config/models.yaml:/app/config/models.yaml:ro"

  # OPT-IN local Redis for idempotency, rate-limit, and thread-reuse development
  # and manual testing. One Redis backs every enabled Redis-backed feature; the
  # gateway opens ONE connection.
  #
  # The correct REDIS_URL depends on where the GATEWAY PROCESS runs, so the two
  # local setups must not be mixed:
  #
  # Redis ONLY (for a natively run gateway, or `npm run test:redis`) — naming the
  # service keeps the gateway container out of it:
  #   docker compose --profile redis up -d redis
  #   export REDIS_URL=redis://127.0.0.1:6379
  #
  # Gateway AND Redis together — inside the gateway container 127.0.0.1 is that
  # container, so the Redis host must be this service's name:
  #   REDIS_URL=redis://redis:6379 docker compose --profile redis up --build
  #
  # Production requirements are NOT met by this local service. A hosted
  # deployment must additionally provide: network isolation (private subnet or
  # equivalent), Redis ACL/authentication, TLS (`rediss://`) where the endpoint
  # is not on a trusted private link, the application-layer
  # IDEMPOTENCY_ENCRYPTION_KEY, and an IDENTICAL REDIS_URL, encryption key,
  # REDIS_KEY_PREFIX, COLLECTIVIQ_GATEWAY_KEYS set, and RATE_LIMIT_* settings
  # across every replica.
  redis:
    profiles: ["redis"]
    image: redis:8.8.2-alpine
    restart: unless-stopped
    # Published only to host loopback, exactly like the gateway.
    ports:
      - "127.0.0.1:6379:6379"
    # Persistence is disabled on purpose: idempotency records are short-lived,
    # encrypted cache state bounded by IDEMPOTENCY_TTL_MS. Losing them costs at
    # most the replay protection for in-flight keys; it is never a data-loss
    # event, so RDB snapshots and AOF are unnecessary (and would write
    # ciphertext to disk for no benefit).
    command:
      - "redis-server"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
    # No password is configured here. This service is reachable only from the
    # Compose network and host loopback; a production deployment must use a
    # managed secret, never a password embedded in a committed file.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
