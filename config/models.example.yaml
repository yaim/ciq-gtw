# Example virtual model configuration for the CollectivIQ gateway scaffold.
#
# Copy this file to config/models.yaml (git-ignored) and adjust for your
# deployment. Model IDs and the source names under `selectedLlms` /
# `answerSource` are configurable examples only; they are NOT verified against
# any CollectivIQ account and carry no context-window or token-limit claims.
#
# Most examples set toolMode: disabled. The single exception,
# collectiviq-claude-tools, sets toolMode: emulated to opt into SUPPORTED BETA
# emulated tool calling (see .agent/docs/tech-software-spec.md sections 12 and
# 30). All eight section-30 release gates were measured live on 2026-09-01 and
# passed, which graduated the mode from experimental to supported opt-in beta.
# Beta is NOT production-ready — one passing campaign is not repeatability, a
# cross-account guarantee, or a cross-version guarantee — so no committed default
# selects this model, and it must remain non-default until a separate
# default-enablement decision is recorded in spec section 30 after the relevant
# Phase 4 controls exist and have been reviewed. `toolMode: emulated` REQUIRES
# `promptMode: protocol`; `toolMode: native` remains unavailable and is rejected
# at request time.
#
# The gateway returns model-PROPOSED tool calls but never executes, authorizes,
# or simulates a tool; OpenCode remains responsible for tool permissions and
# execution. In emulated mode the validated tool schemas, prior tool arguments,
# and prior tool results ARE serialized into the prompt sent to CollectivIQ (they
# are not logged or retained by the gateway). Each tool-loop round creates a new
# upstream thread.
#
# `promptMode` selects prompt serialization:
#   - protocol (default when omitted): the normative full-history COLLECTIVIQ
#     GATEWAY PROTOCOL header + versioned JSON conversation envelope.
#   - direct: an account-specific, intentionally LOSSY profile that submits only
#     the latest user-message content verbatim (no protocol wrapper, no envelope,
#     no role labels, and NO system/developer/assistant/earlier-user content).
#     Use only where the full-history protocol wrapper is rejected upstream.

models:
  collectiviq-claude:
    displayName: CollectivIQ Claude
    selectedLlms:
      - claude
    generateCombined: false
    answerSource: claude
    toolMode: disabled
    promptMode: protocol
    requestTimeoutMs: 90000
    pollIntervalMs: 2000
    maxPollIntervalMs: 5000
    maximumPromptBytes: 6291456

  collectiviq-claude-direct:
    displayName: CollectivIQ Claude Direct
    selectedLlms:
      - claude
    generateCombined: false
    answerSource: claude
    toolMode: disabled
    promptMode: direct
    requestTimeoutMs: 90000
    pollIntervalMs: 2000
    maxPollIntervalMs: 5000
    maximumPromptBytes: 6291456

  collectiviq-consensus:
    displayName: CollectivIQ Consensus
    selectedLlms:
      - gpt
      - claude
      - gemini
    generateCombined: true
    answerSource: combined
    toolMode: disabled
    promptMode: protocol
    requestTimeoutMs: 90000
    pollIntervalMs: 2000
    maxPollIntervalMs: 5000
    maximumPromptBytes: 6291456

  collectiviq-coder:
    displayName: CollectivIQ Coder
    selectedLlms:
      - gpt
      - claude
    generateCombined: true
    answerSource: combined
    toolMode: disabled
    promptMode: protocol
    requestTimeoutMs: 90000
    pollIntervalMs: 2000
    maxPollIntervalMs: 5000
    maximumPromptBytes: 6291456

  collectiviq-fast:
    displayName: CollectivIQ Fast
    selectedLlms:
      - gpt
    generateCombined: false
    answerSource: gpt
    toolMode: disabled
    promptMode: protocol
    requestTimeoutMs: 60000
    pollIntervalMs: 2000
    maxPollIntervalMs: 5000
    maximumPromptBytes: 6291456

  # Supported opt-in BETA emulated tool-calling model; no committed default selects
  # it. Claude-only source; protocol prompt mode is required for emulated tools.
  # All eight section-30 release gates passed in the completed 2026-09-01 live
  # campaign, but beta is not production readiness, so keep this out of foreground/
  # default use until a separate default-enablement decision is recorded in spec
  # section 30 after the relevant Phase 4 controls.
  # The gateway returns proposed tool calls only — it never executes a tool.
  collectiviq-claude-tools:
    displayName: CollectivIQ Claude (Tools, beta)
    selectedLlms:
      - claude
    generateCombined: false
    answerSource: claude
    toolMode: emulated
    promptMode: protocol
    requestTimeoutMs: 90000
    pollIntervalMs: 2000
    maxPollIntervalMs: 5000
    maximumPromptBytes: 6291456
