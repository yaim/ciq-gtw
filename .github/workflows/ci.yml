name: CI

on:
  push:
  pull_request:

# Least privilege: the workflow only needs to read repository contents.
permissions:
  contents: read

jobs:
  validate:
    name: Validate (Node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run validation matrix
        run: npm run validate

  docker-build:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        # Local build only: no registry login, no secrets, no push.
        run: docker build --tag collectiviq-gateway:ci .
