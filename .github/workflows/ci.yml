name: CI

on:
  push:
  pull_request:

# Least privilege: the workflow only needs to read repository contents.
permissions:
  contents: read

jobs:
  validate:
    name: Validate (Node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run validation matrix
        run: npm run validate

  redis-contract:
    name: Redis idempotency, rate-limit, capacity, and thread-reuse contracts (Node 24)
    runs-on: ubuntu-latest
    # The only job that needs an external service. `npm run validate` stays
    # hermetic and Redis-free; these suites are an ADDITIONAL required gate.
    # `npm run test:redis` runs all FOUR real-Redis suites: Phase 4A
    # idempotency, Phase 4B cross-replica rate limiting, Phase 4D cross-replica
    # active-capacity accounting, and Phase 5A OpenCode thread reuse. The
    # complete four-suite gate passed 86/86 under approved LOCAL runs on
    # 2026-09-03 (the other three had passed 59/59 on 2026-09-02). That recorded
    # evidence comes from approved local runs; this job is separately configured
    # to execute the same four-suite gate. See specification section 29.10.
    # Every suite issues a server-wide SCRIPT FLUSH, so this job must only ever
    # target the disposable service defined below.
    services:
      redis:
        image: redis:8.8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Redis contract suites (idempotency, rate limiting, shared capacity, thread reuse)
        # Synthetic content and credentials only; each suite randomizes its key
        # prefix per run and deletes every key it creates.
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379
        run: npm run test:redis

  docker-build:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        # Local build only: no registry login, no secrets, no push.
        run: docker build --tag collectiviq-gateway:ci .
